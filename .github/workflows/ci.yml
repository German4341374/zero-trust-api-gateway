name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run all local checks
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  policy:
    name: OPA policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Rego policy
        run: docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.17.0 test /policies

  container-security:
    name: Container security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:2.12.0-alpine < Dockerfile
      - name: Build application image
        run: docker build --tag zero-trust-api-gateway:ci .
      - name: Scan image for critical vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.72.0 image
          --exit-code 1 --severity CRITICAL --ignore-unfixed
          zero-trust-api-gateway:ci

  compose-smoke:
    name: Compose zero-trust smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.0.0
        with:
          node-version: 24.18.0
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Start stack
        run: docker compose up --build --detach
      - name: Verify authentication and policy boundaries
        run: node scripts/smoke.mjs
      - name: Show service state after failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
